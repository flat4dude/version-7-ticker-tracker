<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalshi Gold Scalper</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --muted: #8b949e; --gold: #f2ca30; --alert: #f85149; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; box-sizing: border-box; }
        .terminal { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 420px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .badge { display: block; text-align: center; padding: 10px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; margin-bottom: 15px; }
        .std { background: rgba(227,179,65,0.15); color: #e3b341; border: 1px solid rgba(227,179,65,0.3); }
        .trig { background: rgba(248,81,73,0.2); color: var(--alert); border: 1px solid var(--alert); animation: p 1s infinite; }
        @keyframes p { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        .row { display: flex; align-items: center; background: #0d1117; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 12px; }
        .lbl { font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; width: 100%; }
        .inp { flex: 1; background: none; border: none; color: #fff; text-align: right; padding-right: 12px; font-size: 1.15rem; font-weight: 600; font-family: monospace; height: 40px; }
        .inp:disabled { color: var(--muted); background: rgba(0,0,0,0.2); }
        .btn { flex: 1; background: #21262d; color: #fff; border: 1px solid var(--border); padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="terminal">
    <div style="text-align:center;margin-bottom:15px;">
        <h1 style="font-size:1.25rem;margin:0;">Automated Kalshi Gold Scalper</h1>
        <h2 style="font-size:0.9rem;color:var(--gold);margin:4px 0 0 0;">🏆 KXGOLD15M Terminal</h2>
    </div>
    <div id="status" class="badge std">● Standby WAITING FOR WINDOW</div>
    
    <div>
        <label class="lbl">📡 Live Spot Price ($)</label>
        <div class="row"><input type="number" id="spot" class="inp" step="0.01" value="4368.60" oninput="u('spot',this.value)"></div>
        
        <label class="lbl">Target Strike ($)</label>
        <div class="row"><input type="number" id="strike" class="inp" step="0.01" value="4365.00" oninput="u('strike',this.value)"></div>
        
        <label class="lbl">⏱️ Target Window Range (1-15 min)</label>
        <div class="row"><input type="number" id="window" class="inp" step="1" min="1" max="15" value="5" oninput="u('window',this.value)"></div>
        
        <label class="lbl"><span>⚙️ Trigger Floor (%)</span><label style="color:var(--gold);cursor:pointer;"><input type="checkbox" id="lock" checked onchange="tl(this.checked)"> 🔒 Lock</label></label>
        <div class="row"><input type="number" id="floor" class="inp" value="86" disabled oninput="u('floor',this.value)"></div>
    </div>

    <div style="display:flex;gap:10px;margin:15px 0;">
        <div id="up" style="flex:1;text-align:center;padding:12px;border-radius:24px;font-weight:800;background:rgba(46,160,67,0.1);color:#56d364;border:1px solid rgba(46,160,67,0.3);">Up · --%</div>
        <div id="down" style="flex:1;text-align:center;padding:12px;border-radius:24px;font-weight:800;background:rgba(248,81,73,0.1);color:#ff7b72;border:1px solid rgba(248,81,73,0.3);">Down · --%</div>
    </div>

    <div style="display:flex;gap:10px;margin-bottom:15px;">
        <button id="mute" onclick="ta()" class="btn" style="color:#ff7b72;">🔇 MUTED</button>
        <button onclick="fs()" class="btn" style="background:#2ea043;border-color:rgba(46,160,67,0.4);">🔄 Sync Math</button>
    </div>
    
    <div id="notice" style="font-size:0.75rem;color:#58a6ff;text-align:center;font-style:italic;margin-bottom:10px;">🟢 Live 15s API Stream Active</div>
    <div style="display:flex;justify-content:between;font-size:0.85rem;border-top:1px solid var(--border);padding-top:10px;">
        <span>⏱ Auto Time Left:</span><span id="clock" style="font-weight:bold;margin-left:auto;color:var(--gold);font-family:monospace;">--:--</span>
    </div>
</div>

<script>
    let d = { spot: 4368.60, strike: 4365.00, floor: 86, window: 5, up: 50, secs: 60, muted: true };
    let actx = null, bId = null;

    function beep() {
        if (d.muted) return;
        try {
            if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
            let o = actx.createOscillator(), g = actx.createGain();
            o.type = "sine"; o.frequency.setValueAtTime(940, actx.currentTime);
            g.gain.setValueAtTime(0.15, actx.currentTime);
            o.connect(g); g.connect(actx.destination); o.start();
            g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.15);
            o.stop(actx.currentTime + 0.16);
        } catch (e) {}
    }

    function ta() {
        d.muted = !d.muted; const b = document.getElementById('mute');
        b.innerText = d.muted ? "🔇 MUTED" : "🔊 LIVE";
        b.style.color = d.muted ? "#ff7b72" : "#56d364";
        if (!d.muted && !actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function tl(l) { document.getElementById('floor').disabled = l; }
    function u(f, v) { let p = parseFloat(v); if (!isNaN(p)) { d[f] = p; calc(); } }

    async function api() {
        try {
            const r = await fetch('https://binance.us');
            const res = await r.json();
            if (res && res.price) {
                d.spot = parseFloat(res.price);
                document.getElementById('spot').value = d.spot.toFixed(2);
                calc();
            }
        } catch (e) { console.warn("API limit, holding parameters."); }
    }

    function fs() {
        document.getElementById('notice').innerText = "⏳ Synchronizing price feed...";
        d.spot = parseFloat(document.getElementById('spot').value) || 4368.60;
        d.strike = parseFloat(document.getElementById('strike').value) || 4365.00;
        d.floor = parseFloat(document.getElementById('floor').value) || 86;
        d.window = parseFloat(document.getElementById('window').value) || 5;
        api();
        setTimeout(() => { document.getElementById('notice').innerText = "🟢 Live 15s API Stream Active"; }, 1200);
    }

    function calc() {
        let dist = d.spot - d.strike;
        let p = 50 + (dist * 14.5);
        let cup = dist <= -4.0 ? 0.1 : dist >= 4.0 ? 99.9 : Math.min(99, Math.max(1, Math.round(p)));
        d.up = cup;
        let cdn = cup === 0.1 ? "99.9" : cup === 99.9 ? "0.1" : (100 - cup);
        document.getElementById('up').innerText = `Up · ${cup}%`;
        document.getElementById('down').innerText = `Down · ${cdn}%`;
    }

    function tick() {
        let now = new Date();
        d.secs = (15 * 60) - ((now.getMinutes() % 15) * 60 + now.getSeconds());
        let m = Math.floor(d.secs / 60).toString().padStart(2, '0');
        let s = (d.secs % 60).toString().padStart(2, '0');
        document.getElementById('clock').innerText = `${m}:${s}`;

        const isTime = d.secs <= (d.window * 60);
        const isPrem = d.up >= d.floor;
        const b = document.getElementById('status');

        if (isTime && isPrem) {
            b.innerText = "⚠️ TRADING WINDOW OPEN"; b.className = "badge trig";
            if (!bId) { beep(); bId = setInterval(beep, 2000); }
        } else {
            b.innerText = "● Standby WAITING FOR WINDOW"; b.className = "badge std";
            if (bId) { clearInterval(bId); bId = null; }
        }
    }

    setInterval(api, 15000);
    setInterval(() => { calc(); tick(); }, 1000);
    api(); calc(); tick();
</script>
</body>
</html>
